<div class="perfil-page">
  <div class="profile-cover"></div>

  <div class="profile-avatar-section">
    <div class="profile-avatar">{{ iniciales() }}</div>
    <div class="profile-actions">
      <button type="button" class="btn-profile-action" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
      <button type="button" class="btn-profile-action" (click)="navigateToEditarPerfil()">
        Editar perfil
      </button>
    </div>
  </div>

  <div class="profile-info">
    <h1 class="profile-name">{{ nombre() }}</h1>
    <p class="profile-username">
      {{ username() }}<span *ngIf="ubicacion()"> · {{ ubicacion() }}</span>
    </p>
    <p class="profile-bio" *ngIf="bio()">{{ bio() }}</p>
  </div>

  <div class="profile-stats">
    <div class="stat-item">
      <div class="stat-num">{{ totalRecetas() }}</div>
      <div class="stat-label">Recetas</div>
    </div>
  </div>

  <h3 class="profile-recipes-title">Recetas mejor valoradas</h3>

  <div class="recipes-grid" *ngIf="topRecetas().length > 0">
    <div class="recipe-card-mini" *ngFor="let r of topRecetas()">
      <div class="recipe-card-img">
        <img [src]="r.imagen_url || 'https://www.bettycrocker.lat/mx/wp-content/uploads/sites/2/2020/12/BCmexico-recipe-pastel-maravilla-de-chocolate.png'" alt="{{ r.titulo }}">
      </div>
      <div class="recipe-card-body">
        <p class="recipe-card-name">{{ r.titulo }}</p>
        <div class="recipe-card-meta">
          <span>⏱ {{ r.tiempo_aproximado }}</span>
          <span>♥ {{ r.likes }}</span>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="topRecetas().length === 0" style="text-align:center; color:#999; padding: 16px;">
    Aún no tienes recetas con likes.
  </p>
</div>

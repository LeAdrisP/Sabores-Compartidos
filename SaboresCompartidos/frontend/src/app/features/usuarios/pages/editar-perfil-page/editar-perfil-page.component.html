<div class="edit-profile-screen-wrapper">
  <div class="phone-canvas">
    <div class="screen-edit">

      <div class="edit-header">
        <button class="btn-back" (click)="cancelar()">
          <span class="back-arrow">←</span>
        </button>
        <h2>Editar perfil</h2>
        <button class="btn-save" (click)="guardarPerfil()">Guardar</button>
      </div>

      <div class="avatar-edit-section">
        <div class="profile-avatar-circle">
          {{ iniciales || 'US' }}
          <div class="camera-badge">■</div>
        </div>
        <span class="change-photo-link">Cambiar foto</span>
      </div>

      <div class="edit-form-body">

        <div class="section-divider-label">Información personal</div>

        <div class="field-group">
          <label class="field-label">Nombre</label>
          <input class="field-input" type="text"
            [(ngModel)]="nombre"
            placeholder="Ej. Ana García" />
        </div>

        <div class="field-group">
          <label class="field-label">Nombre del usuario</label>
          <input class="field-input" type="text"
            [(ngModel)]="username"
            placeholder="Ej. @anag" />
        </div>

        <div class="field-group">
          <label class="field-label">Biografía</label>
          <textarea class="field-textarea"
            [(ngModel)]="bio"
            placeholder="Ej. Amante de la cocina tradicional mexicana..."></textarea>
        </div>

        <div class="field-group">
          <label class="field-label">Ubicación</label>
          <input class="field-input" type="text"
            [(ngModel)]="ubicacion"
            placeholder="Ej. Oaxaca, México" />
        </div>

        <div class="section-divider-label">Cuenta</div>

        <div class="field-group-row">
          <div class="field-group input-half">
            <label class="field-label">Correo electrónico</label>
            <input class="field-input" type="email" disabled
              [value]="''" placeholder="tu@correo.com" />
          </div>
          <button class="btn-action-inline">Confirmar correo</button>
        </div>

        <div class="field-group">
          <label class="field-label">Contraseña actual</label>
          <input class="field-input" type="password" placeholder="••••••••" />
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <span class="toggle-title">Mantener sesión iniciada</span>
            <span class="toggle-subtitle">No cerrar al salir de la app</span>
          </div>
          <div class="toggle-switch" [class.on]="isSessionActive" (click)="toggleSession()"></div>
        </div>

        <div class="section-divider-label">Cambiar contraseña</div>

        <div class="field-group">
          <label class="field-label">Nueva contraseña</label>
          <input class="field-input" type="password" placeholder="Ingrese la nueva contraseña" />
        </div>

        <button class="btn-action-full">Enviar código de verificación</button>

      </div>

      <div class="bottom-spacer"></div>

    </div>
  </div>
</div>

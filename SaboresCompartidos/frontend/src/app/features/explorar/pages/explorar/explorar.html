<header>
  <h1>Explorar</h1>
  <h2>Bienvenido a Sabores Compartidos</h2>
</header>
<div class="explorar-page">

  <div class="opciones">
    <mat-button-toggle-group class="btn-tgl-gp" aria-label="Filtro de tendencias"
      [value]="filtroActivo()" (change)="cambiarFiltro($event.value)">
      <mat-button-toggle class="btn-tgl" value="Populares">Populares</mat-button-toggle>
      <mat-button-toggle class="btn-tgl" value="Recientes">Recientes</mat-button-toggle>
      <mat-button-toggle class="btn-tgl" value="Favoritos">Favoritos</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <p *ngIf="cargando()">Cargando recetas...</p>

  <p *ngIf="!cargando() && recetasOrdenadas().length === 0" style="text-align:center; color:#999; padding: 24px;">
    No hay recetas para mostrar aquí.
  </p>

  <div class="grid" *ngIf="!cargando() && recetasOrdenadas().length > 0">
    <app-card *ngFor="let receta of recetasOrdenadas()" [receta]="receta"></app-card>
  </div>

</div>

<div class="login-screen-wrapper">
  <div class="phone-canvas">
    <div class="screen-login">

      <div class="login-hero">
        <div class="login-hero-text">
          <h1>Sabores<br>compartidos</h1>
          <p>Un recetario hecho entre todos</p>
        </div>
      </div>

      <div class="login-form">
        <h2>Bienvenido de vuelta</h2>
        <p class="subtitle">Inicia sesión para continuar</p>

        <div class="error-container" *ngIf="errorMessage()" style="color: #C4622D; font-size: 13px; font-weight: 700; margin-bottom: 12px; text-align: center;">
          {{ errorMessage() }}
        </div>

        <div class="field-group">
          <label class="field-label">Correo electrónico</label>
          <input class="field-input" type="email" name="correo"
            [ngModel]="correo()" (ngModelChange)="correo.set($event)" placeholder="tu@correo.com" />
        </div>

        <div class="field-group">
          <label class="field-label">Contraseña</label>
          <input class="field-input" type="password" name="contrasena"
            [ngModel]="contrasena()" (ngModelChange)="contrasena.set($event)" placeholder="••••••••" />
        </div>

        <div class="remember-row">
          <div class="remember-check">
            <div class="check-box" [class.checked]="isRemembered()" (click)="toggleRemember()"></div>
            <label>Mantener sesión iniciada</label>
          </div>
          <span class="forgot-link" routerLink="/recuperar">¿Olvidaste?</span>
        </div>

        <button class="btn-primary" (click)="onLoginSubmit()">Iniciar sesión</button>

        <div class="switch-auth">
          ¿Aún no tienes cuenta? <span (click)="navigateToRegistro()">Regístrate</span>
        </div>
      </div>

    </div>
  </div>
</div>

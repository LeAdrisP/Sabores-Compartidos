<div class="recipes-screen-wrapper">
  <div class="phone-canvas">
    <div class="screen-recipes">

      <div class="recipes-header">
        <h2>Mis recetas</h2>
        <p class="recipe-count">{{ recetasFiltradas().length }} receta{{ recetasFiltradas().length === 1 ? '' : 's' }} publicada{{ recetasFiltradas().length === 1 ? '' : 's' }}</p>
      </div>

      <div class="search-box-container">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Buscar receta..."
            [ngModel]="textoBusqueda()" (ngModelChange)="textoBusqueda.set($event)" />
        </div>
      </div>

      <div class="categories-wrapper">
        <div class="categories-scroll">
          <span class="category-pill"
            *ngFor="let cat of categorias"
            [class.active]="categoriaActiva() === cat"
            (click)="seleccionarCategoria(cat)">
            {{ cat }}
          </span>
        </div>
      </div>

      <div class="recipes-container-body">

        <p *ngIf="cargando()" style="text-align:center; padding: 24px;">Cargando tus recetas...</p>

        <p *ngIf="!cargando() && recetasFiltradas().length === 0" style="text-align:center; color:#999; padding: 24px;">
          No se encontraron recetas con ese filtro.
        </p>

        <div class="recetas-grid" *ngIf="!cargando() && recetasFiltradas().length > 0">
          <app-card *ngFor="let receta of recetasFiltradas()" [receta]="receta"></app-card>
        </div>

      </div>

      <div class="bottom-spacer"></div>

    </div>
  </div>
</div>
